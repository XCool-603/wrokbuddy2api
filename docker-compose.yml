services:
  wb2api:
    image: workbuddy2api:latest
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    init: true
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      # auths 凭证卷与 data 数据卷：容器启动时由 entrypoint 自动矫正挂载目录权限（777/chown），
      # 免去宿主机手动 chown 10001 的麻烦，支持跨 uid 直接开箱即用。
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro

  # DeepSeek Harness (dsh) AI Agent 运行环境
  # 使用开箱即用的专业 DSH 容器镜像（预编译 node-pty 原生模块，集成反代桥接与前端安全补丁）；
  # 彻底解决 Alpine 环境下因缺少构建工具导致 node-pty 崩溃及启动时 npx 耗时卡死 ECONNREFUSED 问题。
  # （若机器无法拉取 Docker Hub，也可切为 build: { context: ., dockerfile: Dockerfile.dsh } 本地构建）
  dsh:
    image: smanx/deepseek-harness:latest
    container_name: workbuddy2api-dsh
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - TZ=Asia/Shanghai
      - DSH_PORT=3079
      - PROXY_PORT=3080
      - WORKBODDY_API_KEY=wb2a-admin-secret
      - OPENAI_API_KEY=wb2a-admin-secret
      - OPENAI_BASE_URL=http://wb2api:7863/v1
    volumes:
      # 持久化会话、凭证与配置文件（已预置 workbuddy2api 转发模型补丁）
      - ./data/dsh:/root/.dsh
    depends_on:
      - wb2api

