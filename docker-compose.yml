services:
  wb2api:
    image: workbuddy2api:latest
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      # auths 凭证卷与 data 数据卷：容器启动时由 entrypoint 自动矫正挂载目录权限（777/chown），
      # 免去宿主机手动 chown 10001 的麻烦，支持跨 uid 直接开箱即用。
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro

  # DeepSeek Harness (dsh) AI Agent 运行环境
  # 容器自动集成，docker compose up -d 默认一并启动
  dsh:
    image: node:22-alpine
    container_name: workbuddy2api-dsh
    restart: unless-stopped
    working_dir: /workspace
    # DeepSeek Harness 官方出于安全限制强制仅监听 127.0.0.1 并拒绝 --host 0.0.0.0，
    # 导致容器内无法响应外部映射与跨容器访问。此处通过轻量级 Node 桥接层在 0.0.0.0:3080 监听
    # 并透明转发至容器内部 127.0.0.1:3081，同时重写 Host 解决安全域与跨域阻断。
    command: >
      sh -c "npm config set registry https://registry.npmmirror.com &&
      node -e 'const h=require(\"http\"),n=require(\"net\");const s=h.createServer((q,s)=>{const p=h.request({hostname:\"127.0.0.1\",port:3081,path:q.url,method:q.method,headers:{...q.headers,host:\"127.0.0.1:3081\"}},r=>{s.writeHead(r.statusCode,r.headers);r.pipe(s);});q.pipe(p);p.on(\"error\",()=>{s.writeHead(502);s.end(\"dsh starting...\");});});s.on(\"upgrade\",(q,c,d)=>{const u=n.connect(3081,\"127.0.0.1\",()=>{let m=q.method+\" \"+q.url+\" HTTP/1.1\\r\\n\";for(const[k,v]of Object.entries(q.headers))m+=k+\": \"+(k.toLowerCase()===\"host\"?\"127.0.0.1:3081\":v)+\"\\r\\n\";m+=\"\\r\\n\";u.write(m);if(d&&d.length)u.write(d);c.pipe(u).pipe(c);});u.on(\"error\",()=>c.destroy());c.on(\"error\",()=>u.destroy());});s.listen(3080,\"0.0.0.0\",()=>console.log(\"[dsh-bridge] 0.0.0.0:3080 -> 127.0.0.1:3081 ready\"));' &
      npx -y @deepseek-ai/dsh web --port 3081"
    environment:
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - OPENAI_BASE_URL=http://wb2api:7863/v1
      - OPENAI_API_BASE=http://wb2api:7863/v1
      - DEEPSEEK_BASE_URL=http://wb2api:7863/v1
      - OPENAI_API_KEY=wb2a-admin-secret
      - PORT=3080
    ports:
      - "3080:3080"
    volumes:
      - ./data/dsh:/workspace
    depends_on:
      - wb2api

