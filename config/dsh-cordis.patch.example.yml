# DeepSeek Harness (DSH) 预置 Web Profile 配置补丁示例文件
# 用于自动注册本地 workbuddy2api (wb2api) 模型网关，开箱即用

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      workboddy:
        displayName: workbuddy2api
        apiKeyEnv: WORKBODDY_API_KEY
        api: openai-completions
        baseURL: http://wb2api:7863/v1
        models:
          - id: global:default-model
            name: Auto (智能调度)
            contextWindow: 176000
            maxTokens: 24000
          - id: global:fast-model
            name: Fast (极速)
            contextWindow: 200000
            maxTokens: 32000
          - id: global:balanced-model
            name: Balanced (均衡)
            contextWindow: 256000
            maxTokens: 32000
          - id: global:primary-model
            name: Primary (主力)
            contextWindow: 272000
            maxTokens: 72000
          - id: global:deep-model
            name: Deep (深度推理)
            contextWindow: 176000
            maxTokens: 24000
          - id: global:deepseek-v4.1-flash
            name: DeepSeek-V4.1-Flash
            contextWindow: 1000000
            maxTokens: 128000
          - id: global:kimi-k2.8-preview
            name: Kimi-K2.8-Preview
            contextWindow: 1000000
            maxTokens: 32000
          - id: global:glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 1000000
            maxTokens: 32000
          - id: global:gpt-6-astra
            name: GPT-6-Astra
            contextWindow: 1000000
            maxTokens: 128000
          - id: global:gpt-5.6-sol
            name: GPT-5.6-Sol
            contextWindow: 1000000
            maxTokens: 128000
          - id: global:gemini-3.5-flash
            name: Gemini-3.5-Flash
            contextWindow: 1000000
            maxTokens: 65536
          - id: dsh
            name: DeepSeek Harness (dsh Agent)
            contextWindow: 131072
            maxTokens: 8192

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: workboddy
    model: global:deepseek-v4.1-flash
